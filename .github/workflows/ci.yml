name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]  # macos-14 = Apple Silicon (arm64)
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      DATAFUZZY_MODELS_DIR: ${{ github.workspace }}/models/installed
      DATAFUZZY_REQUIRE_MODEL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: uv sync --frozen
      - uses: actions/cache@v6
        with:
          path: models/installed
          key: models-${{ hashFiles('src/datafuzzy/models_manifest.json') }}
      - name: Download NER models (same code path as the app)
        run: >
          uv run python -c "from datafuzzy.core.models import *;
          [download_model(s, models_dir()) for s in load_manifest() if not is_installed(s, models_dir())]"
      - run: uv run pytest --cov=datafuzzy --cov-report=xml
      - uses: codecov/codecov-action@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
